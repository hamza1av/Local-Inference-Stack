[package]
name = "stack-gateway"
version = "0.1.0"
edition = "2021"
description = "Tiny OpenAI-compatible gateway for the local inference stack"
license = "MIT"
publish = false

[lib]
name = "stack_gateway"
path = "src/lib.rs"

[[bin]]
name = "stack-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1"
dotenvy = "0.15"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = { version = "0.8", default-features = false, features = ["parse", "preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
