[project]
name = "stack-agents"
version = "0.1.0"
description = "LangGraph agents for the local inference stack: routing via decision models, tool-calling examples, OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.26,<2",
    "openai>=1.80",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "langfuse>=3.0,<4",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.scripts]
stack-agents = "stack_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stack_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "ollama: real smoke test against Ollama (needs 127.0.0.1:11434 with lfm3:1.7b)",
]
