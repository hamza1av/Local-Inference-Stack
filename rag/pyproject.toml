[project]
name = "stack-rag"
version = "0.1.0"
description = "Document RAG in SQLite (FTS5 + sqlite-vec) with EmbeddingGemma: CLI, Python API and MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.12",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
stack-rag = "stack_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stack_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
